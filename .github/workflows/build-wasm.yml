name: Build Compose Wasm (Haze prototype)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'compose-app/**'
      - '.github/workflows/build-wasm.yml'
  pull_request:
    paths:
      - 'compose-app/**'
      - '.github/workflows/build-wasm.yml'

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No Gradle wrapper in repo yet — download a pinned Gradle instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Build Wasm distribution
        working-directory: compose-app
        run: gradle :composeApp:wasmJsBrowserDistribution --stacktrace

      - name: List output
        working-directory: compose-app
        run: ls -lh composeApp/build/dist/wasmJs/productionExecutable

      - uses: actions/upload-artifact@v4
        with:
          name: disciply-wasm
          path: compose-app/composeApp/build/dist/wasmJs/productionExecutable
