name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.3.13750724"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> $GITHUB_ENV

      - name: Install frontend dependencies
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Init Android project
        run: npx tauri android init --ci

      - name: Build APK
        run: npx tauri android build --apk --target aarch64

      - name: Verify APK signature and sign if missing
        run: |
          set -euo pipefail
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | grep -viE "unsigned|debug" | head -1)
          echo "APK found: $APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          ZIPALIGN=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | tail -1)
          if "$APKSIGNER" verify --print-certs "$APK" > /dev/null 2>&1; then
            echo "APK is signed, keeping as-is"
            cp "$APK" Disciply-1.0.0-arm64.apk
          else
            echo "APK is unsigned, signing it"
            keytool -genkeypair -v -keystore disciply.keystore -alias disciply \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass disciply123 -keypass disciply123 \
              -dname "CN=Disciply, OU=Disciply, O=Disciply, L=, S=, C=RO" > /dev/null 2>&1
            "$ZIPALIGN" -f 4 "$APK" aligned.apk
            "$APKSIGNER" sign --ks disciply.keystore --ks-key-alias disciply \
              --ks-pass pass:disciply123 --key-pass pass:disciply123 \
              --out Disciply-1.0.0-arm64.apk aligned.apk
          fi
          "$APKSIGNER" verify --print-certs Disciply-1.0.0-arm64.apk | head -4
          ls -lh Disciply-1.0.0-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: disciply-android-arm64
          path: Disciply-1.0.0-arm64.apk